services:
  - type: web
    name: erp-system
    runtime: node
    buildCommand: npm install && npm run render-build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: HERMES_BRIDGE_API_KEY
        sync: false
      - key: MARKETER_BRIDGE_API_KEY
        sync: false
      - key: DRIVE_TOKEN_ENC_KEY
        sync: false
      # VenueDA 외부 상담 연동. secret 값은 Render 대시보드에서 직접 입력한다.
      - key: VENUEDA_BASE_URL
        value: https://venueda.kr
      - key: VENUEDA_INTEGRATION_SECRET
        sync: false
      - key: VENUEDA_DEFAULT_ASSIGNEE_EMAIL
        value: qkrtjrdud952@gmail.com
      # Dedicated DOT credential; never share the general ERP/bridge keys.
      - key: DOT_INTEGRATION_SECRET
        sync: false
      - key: ERP_MAINTENANCE_SECRET
        sync: false
      - key: DOT_MONITOR_ENABLED
        value: "false"
      - key: DOT_MONITOR_START_DATE
        sync: false
